scalar AWSDate
scalar AWSDateTime

enum AssessmentStatus { UNRECORDED RECORDING RECORDED LOCKED }
enum ItemOutcome { APPLIED REJECTED REVIEW CONFLICT }
enum ScoreStatus { ACTIVE CONFLICT_REVIEW }
enum MarkStatus { SCORED ABSENT NOT_ASSESSED }
enum PaperMark { SCORED ABSENT NOT_ASSESSED MISSING }
enum Checkpoint { OPENER MIDTERM ENDTERM }
enum ResultKind { INTERIM FINAL }
enum ResultSetStatus { NOT_CALCULATED CALCULATED PUBLISHED UNPUBLISHED }   # UNPUBLISHED: a teacher's view of a draft
enum IssueSeverity { BLOCKING WARNING }
