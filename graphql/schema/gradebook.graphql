type Mutation {
  createAssessment(input: CreateAssessmentInput!): Assessment
  updateAssessment(input: UpdateAssessmentInput!): Assessment
  lockAssessment(school_id: ID!, assessment_id: ID!): Assessment
  unlockAssessment(school_id: ID!, assessment_id: ID!): Assessment   # admin, before results are published
  deleteAssessment(input: DeleteAssessmentInput!): ID!         # hard delete, before marks are entered
  softDeleteAssessment(input: DeleteAssessmentInput!): ID!     # soft delete by admin, cascades to marks
  restoreAssessment(school_id: ID!, assessment_id: ID!): Assessment   # admin restores a deleted assessment and marks
  submitScores(input: SubmitScoresInput!): SubmitScoresResult!
  resolveScoreConflict(input: ResolveScoreConflictInput!): Score
  setCheckpointWeights(input: SetCheckpointWeightsInput!): GradeRule!      # any gradebook role
  calculateTermResults(input: CalculateTermResultsInput!): ResultSet!      # Admin
  calculateSchoolResults(input: CalculateSchoolResultsInput!): [ClassOutcome!]!
  publishResults(input: PublishResultsInput!): ResultSet!                  # Admin; idempotent
  publishSchoolResults(input: PublishSchoolResultsInput!): [ClassOutcome!]!

  createTeacher(input: CreateTeacherInput!): TeacherAccount!                 # Admin; creates the sign-in account
  updateTeacher(input: UpdateTeacherInput!): Teacher!                        # Admin
  setTeacherAssignments(input: SetTeacherAssignmentsInput!): Teacher!        # Admin
  setClassTeacher(input: SetClassTeacherInput!): Class!                      # Admin
  deactivateTeacher(input: TeacherRefInput!): Teacher!                       # Admin
  reactivateTeacher(input: TeacherRefInput!): Teacher!                       # Admin
  resetTeacherPassword(input: ResetTeacherPasswordInput!): TeacherAccount!   # Admin
  createClass(input: CreateClassInput!): Class!                              # Admin
  updateClass(input: UpdateClassInput!): Class!                              # Admin
  deleteClass(input: DeleteClassInput!): ID!                                 # Admin; empty classes only
  createStudent(input: CreateStudentInput!): Student!                        # Admin | class teacher
  updateStudent(input: UpdateStudentInput!): Student!                        # Admin | class teacher
  transferStudent(input: TransferStudentInput!): Student!                    # Admin
  setStudentStatus(input: SetStudentStatusInput!): Student!                  # Admin | class teacher
  requestReportCardDownload(input: ReportCardDownloadInput!): ReportCardDownload!   # Admin | class teacher
  createTerm(input: CreateTermInput!): Term!                                  # Admin
  updateTerm(input: UpdateTermInput!): Term!                                  # Admin
  submitAttendance(input: SubmitAttendanceInput!): SubmitAttendanceResult!    # Admin | class teacher
  runRiskPredictions(input: RunRiskPredictionsInput!): RiskRun!               # Admin; queues a fresh run
}